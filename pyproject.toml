[project]
name = "data-ingestion-pipeline"
version = "0.1.0"
description = "Drag-and-drop normalization of messy PDFs and CSVs into strict JSON schemas"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "boto3==1.35.86",
    "aiobotocore==2.17.0",
    "anthropic==0.42.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
    "referencing==0.36.1",
    # PDF partitioning
    "pymupdf==1.25.3",
    "pypdfium2==4.30.1",
    # CSV handling
    "chardet==5.2.0",
    "python-dateutil==2.9.0",
    # Observability
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "structlog==24.4.0",
    # Kafka
    "aiokafka==0.12.0",
    "protobuf==5.29.3",
    # Encryption
    "cryptography==44.0.0",
]

[project.optional-dependencies]
batch = [
    "pyspark==3.5.4",
    "delta-spark==3.3.0",
    "apache-airflow==2.10.4",
    "dbt-core==1.9.1",
    "dbt-postgres==1.9.1",
    "pyarrow==18.1.0",
    "duckdb==1.1.3",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "mypy==1.13.0",
    "ruff==0.8.6",
    "types-boto3==1.35.86",
    "moto[s3]==5.0.27",
    "factory-boy==3.3.1",
    "faker==33.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "batch"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "COM", "C4", "PT", "RET", "SIM"]
ignore = ["S101", "COM812"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pipeline.uploads.*", "pipeline.schemas.*", "pipeline.partition.*", "pipeline.limits.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services",
    "slow: marks tests that take >10s",
]
