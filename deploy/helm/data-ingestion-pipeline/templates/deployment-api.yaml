apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-ingestion-pipeline.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- include "data-ingestion-pipeline.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "data-ingestion-pipeline.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "data-ingestion-pipeline.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.databaseUrl.secretName }}
                  key: {{ .Values.secrets.databaseUrl.key }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.anthropicApiKey.secretName }}
                  key: {{ .Values.secrets.anthropicApiKey.key }}
            - name: KMS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.kmsKeyId.secretName }}
                  key: {{ .Values.secrets.kmsKeyId.key }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otelCollectorEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "data-ingestion-pipeline-api"
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
